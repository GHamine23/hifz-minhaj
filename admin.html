<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>إدارة حفظ المنهاج</title>
<meta name="theme-color" content="#8a1e50">
<meta name="robots" content="noindex">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="app.css?v=20261120a">
<link rel="stylesheet" href="admin.css?v=20261120a">
<script>try{var t=localStorage.getItem('hm.theme');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body class="admin">
<div class="app">
  <header class="top">
    <div class="brand"><img src="icons/icon-192.png" alt="" width="30" height="30"><span>لوحة الإدارة</span></div>
    <div class="top-actions"><button class="icon-btn" id="themeBtn" type="button" aria-label="تبديل الوضع الداكن والفاتح"></button></div>
  </header>
  <nav class="atabs" id="atabs" role="tablist" aria-label="أقسام الإدارة" hidden>
    <button type="button" role="tab" data-tab="today" aria-selected="true">اليوم</button>
    <button type="button" role="tab" data-tab="students" aria-selected="false">الطلاب</button>
    <button type="button" role="tab" data-tab="rates" aria-selected="false">النِّسَب</button>
    <button type="button" role="tab" data-tab="msg" aria-selected="false">الرسائل</button>
  </nav>
  <main id="view" class="view" tabindex="-1"></main>
</div>
<div id="sheet" class="sheet" hidden><div class="sheet-card" role="dialog" aria-modal="true"><div id="sheetBody"></div></div></div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
